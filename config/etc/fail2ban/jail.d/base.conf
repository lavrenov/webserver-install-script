[sshd]
enabled = true

[proftpd]
enabled = true

[nginx-limit]
enabled  = true
port     = http,https
filter   = nginx-limit
logpath  = /var/www/**/sites/**/log/nginx/access.log
backend  = polling
findtime = 60
maxretry = 15
bantime  = 1h

